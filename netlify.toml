[build]
  command = "pnpm build"
  publish = "dist"

# ブラウザの言語設定に基づいた自動リダイレクト
[[redirects]]
  from = "/"
  to = "/ja/"
  status = 302
  force = false
  conditions = {Language = ["ja"]}

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = false
  conditions = {Language = ["en"]}

# フォールバック: その他の言語はデフォルト（日本語）へ
[[redirects]]
  from = "/"
  to = "/ja/"
  status = 302
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Astro ビルド成果物はコンテンツハッシュ付きのため長期キャッシュ
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ファビコン (1日)
[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# SVG アセット (1年)
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
